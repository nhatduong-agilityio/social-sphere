services:
  - type: web
    name: social-sphere-backend
    rootDir: backend
    env: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /_health
    envVars:
      - key: NODE_VERSION
        value: 20.0.0 # Keeping your Node version
      - key: NODE_ENV
        value: production
      # Cloudinary environment variables
      - key: CLOUDINARY_NAME
        sync: false # Must be set manually in dashboard
      - key: CLOUDINARY_KEY
        sync: false # Must be set manually in dashboard
      - key: CLOUDINARY_SECRET
        sync: false # Must be set manually in dashboard
      # Strapi environment variables
      - key: DATABASE_URL
        fromDatabase:
          name: social-sphere-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true

databases:
  - name: social-sphere-db
    plan: free
